server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  # Public website at the root; old .php addresses move to their .html pages.
  location / { try_files $uri $uri/ $uri.html =404; }
  location ~ ^/(.+)\.php$ { return 301 /$1.html; }
  # The ERP is a single-page app under /computercentre/.
  location = /computercentre { return 301 /computercentre/; }
  # The Code Lab's LiveCodes app: its compiler sandbox reads these cross-origin.
  location /computercentre/coder/ { add_header Access-Control-Allow-Origin * always; try_files $uri $uri/ =404; }
  location /computercentre/ { try_files $uri $uri/ /computercentre/index.html; }
  location /api/ { proxy_pass http://api:5000/api/; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  add_header X-Frame-Options SAMEORIGIN always;
  add_header X-Content-Type-Options nosniff always;
}
