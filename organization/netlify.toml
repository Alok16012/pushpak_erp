# Headers for security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Caching. Pages themselves are always revalidated, so an edit or a deploy
# shows at once; what they load is kept by the browser and the CDN:
#  - names that carry a content hash never change, so keep them for a year;
#  - images keep their names when replaced, so a week, refreshed in the
#    background after a day;
#  - the site's own small scripts and styles, an hour.
[[headers]]
  for = "/computercentre/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/computercentre/coder/livecodes/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/image/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/logo.webp"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/logo.png"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/computercentre/idealdigiskills-logo.webp"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/computercentre/idealdigiskills-logo.png"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/cms.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

[[headers]]
  for = "/cms-config.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

[[headers]]
  for = "/style.css"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

# The Code Lab (self-hosted LiveCodes): its compiler runs on LiveCodes'
# sandbox origin and loads these scripts cross-origin.
[[headers]]
  for = "/computercentre/coder/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"

# Routing lives in dist/_redirects, written by the build: the website is
# served from /, the ERP from /computercentre/ (see vite.config.ts).
