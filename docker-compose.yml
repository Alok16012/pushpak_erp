services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: idealdigiskills_erp
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: ["erp_postgres:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U erp -d idealdigiskills_erp"], interval: 10s, timeout: 5s, retries: 5 }
  api:
    build: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://erp:${POSTGRES_PASSWORD}@db:5432/idealdigiskills_erp
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET}
      CORS_ORIGINS: ${APP_ORIGIN:-http://localhost}
      BOOTSTRAP_TOKEN: ${BOOTSTRAP_TOKEN}
    depends_on: { db: { condition: service_healthy } }
    healthcheck: { test: ["CMD", "wget", "-qO-", "http://localhost:5000/health/live"], interval: 15s, timeout: 5s, retries: 5 }
  web:
    build: { context: ./organization, args: { VITE_API_URL: /api/v1 } }
    restart: unless-stopped
    ports: ["${WEB_PORT:-80}:80"]
    depends_on: { api: { condition: service_healthy } }
volumes: { erp_postgres: {} }
