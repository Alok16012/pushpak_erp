[build]
builder = "nixpacks"
buildCommand = "cd backend && npm ci && npx prisma generate && npx tsc -p tsconfig.build.json"

[deploy]
startCommand = "cd backend && npm run prisma:migrate && npm start"
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 120
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 5
